name: Quality checks

on:
  push:
    branches: ["**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        id: install-dependencies
        run: npm ci
      - name: Repository policy
        if: ${{ !cancelled() && steps.install-dependencies.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git merge-base origin/dev "$HEAD_SHA" || git rev-list --max-parents=0 "$HEAD_SHA")"
          fi
          npm run check:repository-policy -- --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Preview formatting output
        run: |
          for file in \
            src/thungatha-features/cv-studio/server/cv-tailoring-evidence-map.ts \
            src/thungatha-features/job-discovery/server/job-ai-task-context.ts \
            src/thungatha-features/job-discovery/server/job-ai-understanding-service.ts \
            tests/unit-tests/job-discovery/ui/job-detail-description.test.tsx \
            tests/unit-tests/job-discovery/ui/job-discovery-detail.test.tsx; do
            echo "===== PRETTIER:$file ====="
            npx prettier "$file"
          done
      - name: Formatting
        if: ${{ !cancelled() && steps.install-dependencies.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git merge-base origin/dev "$HEAD_SHA" || git rev-list --max-parents=0 "$HEAD_SHA")"
          fi
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA" |
            xargs -0 -r npx prettier --check
      - name: Lint
        if: ${{ !cancelled() && steps.install-dependencies.outcome == 'success' }}
        run: npm run lint
      - name: Unit tests
        if: ${{ !cancelled() && steps.install-dependencies.outcome == 'success' }}
        run: npm test
      - name: Type-check
        if: ${{ !cancelled() && steps.install-dependencies.outcome == 'success' }}
        run: npx tsc --noEmit
      - name: Production build
        if: ${{ !cancelled() && steps.install-dependencies.outcome == 'success' }}
        run: npm run build
