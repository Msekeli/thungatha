name: Quality checks

on:
  push:
    branches: ["**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Repository policy
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git merge-base origin/dev "$HEAD_SHA" || git rev-list --max-parents=0 "$HEAD_SHA")"
          fi
          npm run check:repository-policy -- --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Formatting
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git merge-base origin/dev "$HEAD_SHA" || git rev-list --max-parents=0 "$HEAD_SHA")"
          fi
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA" |
            xargs -0 -r npx prettier --check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Type-check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
