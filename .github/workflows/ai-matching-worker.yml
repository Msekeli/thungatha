name: AI Job Matching Worker

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-matching-worker
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Process one queued assessment
        env:
          APP_BASE_URL: ${{ secrets.THUNGATHA_BASE_URL }}
          AI_WORKER_SECRET: ${{ secrets.AI_WORKER_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$AI_WORKER_SECRET" ]; then
            echo "Skipping: configure THUNGATHA_BASE_URL and AI_WORKER_SECRET repository secrets."
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            --request POST "${APP_BASE_URL%/}/api/internal/ai-matching/worker" \
            --header "Authorization: Bearer $AI_WORKER_SECRET" \
            --header "Content-Type: application/json"
